# FEM forward problem configuration — Mode I central crack
geometry:
  crack_center:      [0.5, 0.5]
  crack_half_length: 0.15
  domain_size:       [1.0, 1.0]

material:
  E:           1.0
  nu:          0.3
  traction:    0.1
  formulation: plane_stress

fem:
  Nx: 80          # mesh divisions in x
  Ny: 80          # mesh divisions in y
  n_grid: 100     # output evaluation grid (n x n)

postprocess:
  j_integral_radii: [0.03, 0.05, 0.07]
  cod_n_pts: 50
